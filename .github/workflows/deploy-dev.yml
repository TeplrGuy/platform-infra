name: deploy-dev

on:
  workflow_dispatch:
    inputs:
      portal_ref:
        description: Portal commit SHA
        required: true
        type: string
      gateway_ref:
        description: Gateway commit SHA
        required: true
        type: string
      orders_ref:
        description: Orders commit SHA
        required: true
        type: string
      inventory_ref:
        description: Inventory commit SHA
        required: true
        type: string
      notifications_ref:
        description: Notifications commit SHA
        required: true
        type: string
      verify_oidc:
        description: Request a protected, non-deploying Azure OIDC sign-in check
        required: true
        default: false
        type: boolean
      preview_bootstrap:
        description: Preview the resource group bootstrap without deploying
        required: true
        default: false
        type: boolean
      bootstrap_rg:
        description: Create only the approved dev resource group after protected preview and approval
        required: true
        default: false
        type: boolean
      preserve_images:
        description: Preserve the built and smoke-tested images without publishing them
        required: true
        default: false
        type: boolean
      preview_foundation:
        description: Preview the registry and vault foundation without deploying it
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preview-foundation:
    if: ${{ inputs.preview_foundation }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Sign in with the protected environment identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preview the resource-group foundation
        env:
          DEPLOYER_OBJECT_ID: ${{ vars.AZURE_DEPLOYER_OBJECT_ID }}
          TARGET_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TARGET_TENANT: ${{ vars.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEPLOYER_OBJECT_ID" != "b6a3c39d-0263-4f01-b975-654cdea443a0" ||
                "$TARGET_SUBSCRIPTION" != "8fcc5e8e-6540-4288-89e7-849e94290205" ||
                "$TARGET_TENANT" != "d11cdc76-c6f2-4368-a98f-498e78a7e011" ]]; then
            echo "::error::The identity, tenant, or subscription does not match the approved target."
            exit 1
          fi
          echo "started foundation what-if run=$GITHUB_RUN_ID commit=$GITHUB_SHA" | tee foundation-audit.log
          if az deployment group what-if \
            --name "foundation-preview-$GITHUB_RUN_ID" \
            --resource-group agtsdlc-dev-rg \
            --template-file infra/foundation.bicep \
            --parameters infra/foundation.parameters.json deployerObjectId="$DEPLOYER_OBJECT_ID" \
            --no-pretty-print --no-prompt --output json > foundation-what-if.json; then
            echo "succeeded foundation what-if" | tee -a foundation-audit.log
          else
            code=$?
            echo "failed foundation what-if exit=$code" | tee -a foundation-audit.log
            exit "$code"
          fi
          if node scripts/validate-foundation-preview.js foundation-what-if.json; then
            echo "succeeded foundation preview completeness check" | tee -a foundation-audit.log
          else
            echo "failed foundation preview completeness check" | tee -a foundation-audit.log
            exit 1
          fi
      - name: Preserve foundation preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-preview-${{ github.run_id }}
          path: |
            foundation-audit.log
            foundation-what-if.json
          if-no-files-found: warn
  preview-bootstrap:
    if: ${{ inputs.preview_bootstrap || inputs.bootstrap_rg }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Sign in with the protected environment identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preview the resource group
        shell: bash
        run: |
          set -euo pipefail
          echo "started bootstrap what-if run=$GITHUB_RUN_ID commit=$GITHUB_SHA" | tee deploy-audit.log
          if az deployment sub what-if \
            --name "rg-bootstrap-preview-$GITHUB_RUN_ID" \
            --location northeurope \
            --template-file infra/bootstrap-rg.bicep \
            --no-pretty-print --no-prompt --output json > bootstrap-what-if.json; then
            echo "succeeded bootstrap what-if" | tee -a deploy-audit.log
          else
            code=$?
            echo "failed bootstrap what-if exit=$code" | tee -a deploy-audit.log
            exit "$code"
          fi
          node scripts/validate-rg-preview.js bootstrap-what-if.json
      - name: Preserve preview and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-preview-${{ github.run_id }}
          path: |
            deploy-audit.log
            bootstrap-what-if.json
          if-no-files-found: warn
  verify-identity:
    if: ${{ inputs.verify_oidc }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Sign in with the protected environment identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Verify the token tenant
        env:
          EXPECTED_TENANT: ${{ vars.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          tenant="$(az account get-access-token --resource https://management.azure.com/ --query tenant -o tsv)"
          if [[ -z "$EXPECTED_TENANT" || "$tenant" != "$EXPECTED_TENANT" ]]; then
            echo "::error::Azure token tenant does not match the configured tenant."
            exit 1
          fi
          echo "OIDC sign-in succeeded. No Azure resource or RBAC changes were made."
  validate-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PORTAL_REF: ${{ inputs.portal_ref }}
      GATEWAY_REF: ${{ inputs.gateway_ref }}
      ORDERS_REF: ${{ inputs.orders_ref }}
      INVENTORY_REF: ${{ inputs.inventory_ref }}
      NOTIFICATIONS_REF: ${{ inputs.notifications_ref }}
    steps:
      - name: Require immutable application revisions
        shell: bash
        run: |
          set -euo pipefail
          for ref in "$PORTAL_REF" "$GATEWAY_REF" "$ORDERS_REF" "$INVENTORY_REF" "$NOTIFICATIONS_REF"; do
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Each application revision must be a full lowercase Git commit SHA."
              exit 1
            fi
          done
  validate-bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/public-ingress.test.js tests/validate-rg-preview.test.js tests/validate-foundation-preview.test.js
  quality:
    needs: validate-inputs
    uses: ./.github/workflows/full-stack-e2e.yml
    with:
      portal_ref: ${{ inputs.portal_ref }}
      gateway_ref: ${{ inputs.gateway_ref }}
      orders_ref: ${{ inputs.orders_ref }}
      inventory_ref: ${{ inputs.inventory_ref }}
      notifications_ref: ${{ inputs.notifications_ref }}
      preserve_images: ${{ inputs.preserve_images }}
  bootstrap-rg:
    if: ${{ inputs.bootstrap_rg }}
    needs: [preview-bootstrap, validate-bicep, quality]
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-preview-${{ github.run_id }}
          path: approved-preview
      - name: Sign in with the protected environment identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Recheck and create the resource group
        shell: bash
        run: |
          set -euo pipefail
          echo "started bootstrap what-if run=$GITHUB_RUN_ID commit=$GITHUB_SHA" | tee bootstrap-apply-audit.log
          if az deployment sub what-if \
            --name "rg-bootstrap-recheck-$GITHUB_RUN_ID" \
            --location northeurope \
            --template-file infra/bootstrap-rg.bicep \
            --no-pretty-print --no-prompt --output json > recheck-what-if.json; then
            echo "succeeded bootstrap what-if" | tee -a bootstrap-apply-audit.log
          else
            code=$?
            echo "failed bootstrap what-if exit=$code" | tee -a bootstrap-apply-audit.log
            exit "$code"
          fi
          node scripts/validate-rg-preview.js recheck-what-if.json approved-preview/bootstrap-what-if.json
          echo "started resource-group bootstrap run=$GITHUB_RUN_ID commit=$GITHUB_SHA" | tee -a bootstrap-apply-audit.log
          if az deployment sub create \
            --name "rg-bootstrap-$GITHUB_RUN_ID" \
            --location northeurope \
            --template-file infra/bootstrap-rg.bicep \
            --no-prompt --output json > bootstrap-result.json; then
            echo "succeeded resource-group bootstrap" | tee -a bootstrap-apply-audit.log
          else
            code=$?
            echo "failed resource-group bootstrap exit=$code" | tee -a bootstrap-apply-audit.log
            exit "$code"
          fi
      - name: Preserve bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-apply-${{ github.run_id }}
          path: |
            bootstrap-apply-audit.log
            recheck-what-if.json
            bootstrap-result.json
          if-no-files-found: warn
  block-unsafe-release:
    if: ${{ !inputs.bootstrap_rg }}
    needs: [validate-bicep, quality]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "::error::Deployment remains disabled: OIDC, what-if, immutable image promotion and the protected release job are not implemented."
          exit 1
